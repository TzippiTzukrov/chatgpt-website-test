<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images</title>
  <link rel="stylesheet" href="css/images.css">
</head>

<body>

  <header id="top-bar">
    <a href="index.html" id="logo">
      <img src="img/chatgpt-icon.png" alt="ChatGPT icon">
      <span>ChatGPT</span>
    </a>

    <div id="user-actions">
      <button type="button" id="login-btn">Log in</button>
      <button type="button" id="signup-btn">Sign up for free</button>
      <button type="button" id="help-btn" aria-label="Help">?</button>
    </div>

    <nav id="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="images.html">Images</a></li>
        <li><a href="agent.html">Agent</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Images</h1>

    <!-- Section 1: Try a style -->
    <section class="gallery-section" id="styles-section">
      <header class="section-head">
        <h2>Try a style on an image</h2>
        <div class="arrows">
          <button type="button" class="arrow-btn" aria-label="Previous">&lt;</button>
          <button type="button" class="arrow-btn" aria-label="Next">&gt;</button>
        </div>
      </header>

      <ul class="styles-list">
        <li class="style-card">
          <figure>
            <img src="img/sketch.png" alt="Sketch style example">
            <figcaption>Sketch</figcaption>
          </figure>
        </li>
        <li class="style-card">
          <figure>
            <img src="img/dramatic.png" alt="Dramatic style example">
            <figcaption>Dramatic</figcaption>
          </figure>
        </li>
        <li class="style-card">
          <figure>
            <img src="img/plushie.png" alt="Plushie style example">
            <figcaption>Plushie</figcaption>
          </figure>
        </li>
        <li class="style-card">
          <figure>
            <img src="img/retro-anime.png" alt="Retro anime style example">
            <figcaption>Retro anime</figcaption>
          </figure>
        </li>
        <li class="style-card">
          <figure>
            <img src="img/baseball-bobblehead.png" alt="Baseball bobblehead style example">
            <figcaption>Baseball bobblehead</figcaption>
          </figure>
        </li>
        <li class="style-card">
          <figure>
            <img src="img/doodle.png" alt="Doodle style example">
            <figcaption>Doodle</figcaption>
          </figure>
        </li>
      </ul>
    </section>

    <!-- Section 2: Discover something new -->
    <section class="gallery-section" id="discover-section">
      <header class="section-head">
        <h2>Discover something new</h2>
        <div class="arrows">
          <button type="button" class="arrow-btn" aria-label="Previous">&lt;</button>
          <button type="button" class="arrow-btn" aria-label="Next">&gt;</button>
        </div>
      </header>

      <ul class="discover-list">
        <li class="discover-item">
          <a href="#">
            <img src="img/pearl.png" alt="">
            <span>Me as The Girl with a Pearl</span>
          </a>
        </li>
        <li class="discover-item">
          <a href="#">
            <img src="img/product-photo.png" alt="">
            <span>Create a professional product photo</span>
          </a>
        </li>
        <li class="discover-item">
          <a href="#">
            <img src="img/remove-background.png" alt="">
            <span>Remove people in the background</span>
          </a>
        </li>
        <li class="discover-item">
          <a href="#">
            <img src="img/style-me.png" alt="">
            <span>Style me</span>
          </a>
        </li>
        <li class="discover-item">
          <a href="#">
            <img src="img/kpop.png" alt="">
            <span>What would I look like as a K-Pop star?</span>
          </a>
        </li>
        <li class="discover-item">
          <a href="#">
            <img src="img/keychain.png" alt="">
            <span>Turn into a keychain</span>
          </a>
        </li>
      </ul>
    </section>
  </main>

</body>
</html>
